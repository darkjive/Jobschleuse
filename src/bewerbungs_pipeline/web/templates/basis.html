<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block titel %}Jobschleuse{% endblock %}</title>
  <link rel="stylesheet" href="/static/tokens.css">
  <link rel="stylesheet" href="/static/app.css">
  <script src="/static/htmx.min.js" defer></script>
</head>
<body>
  <header class="kopf">
    <div class="kopf-marke">
      <svg class="marke-logo" width="26" height="26" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M3 4h18l-7 8v7l-4 2v-9L3 4z" fill="var(--accent)"/>
      </svg>
      <div class="marke-text">
        <h1>Jobschleuse</h1>
        <p class="marke-claim">Stellen rein, Bewerbungen raus.</p>
      </div>
    </div>
    {% block kopfaktionen %}{% endblock %}
  </header>
  <main>
    {% block inhalt %}{% endblock %}
  </main>
  <footer class="fuss">
    <a href="https://paypal.me/AlainRitter" target="_blank" rel="noopener">Unterstützen via PayPal</a>
  </footer>
</body>
</html>
