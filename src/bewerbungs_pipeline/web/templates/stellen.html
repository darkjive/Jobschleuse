{% extends "basis.html" %}

{% block kopfaktionen %}
<form class="suchform" hx-post="/jobs/fetch" hx-target="#fortschritt">
  <input type="search" name="was" placeholder="Was, z. B. Frontend Entwickler"
         aria-label="Wonach suchen" required>
  <input type="search" name="wo" placeholder="Wo, z. B. Darmstadt"
         aria-label="Wo suchen" required>
  <input type="number" name="umkreis" value="50" min="0" max="200" aria-label="Umkreis in km">
  <select name="seit" aria-label="Veröffentlicht seit">
    <option value="">Alter egal</option>
    <option value="7">letzte 7 Tage</option>
    <option value="14">letzte 14 Tage</option>
    <option value="30">letzte 30 Tage</option>
  </select>
  <label class="haken"><input type="checkbox" name="ohne_zeitarbeit" value="1"> ohne Zeitarbeit</label>
  <label class="haken"><input type="checkbox" name="nur_arbeit" value="1"> keine Ausbildung</label>
  <button class="knopf knopf--haupt" type="submit">Stellen suchen</button>
</form>
<div id="fortschritt" aria-live="polite"></div>
{% endblock %}

{% block inhalt %}
<div class="spalten">
  <aside class="filter">
    <form hx-get="/jobs" hx-target="#stellenliste" hx-trigger="submit, change delay:300ms">
      <label>Status
        <select name="status">
          <option value="">alle</option>
          <option value="new" selected>neu</option>
          <option value="selected">ausgewählt</option>
          <option value="rejected">aussortiert</option>
        </select>
      </label>
      <label>Suche
        <input type="search" name="q" placeholder="Titel oder Firma">
      </label>
      <label>Ort
        <input type="search" name="ort" placeholder="z. B. Darmstadt">
      </label>
      <label class="haken">
        <input type="checkbox" name="verschwunden" value="1">
        auch verschwundene zeigen
      </label>
    </form>
  </aside>

  <section id="stellenliste" hx-get="/jobs?status=new" hx-trigger="load">
    <p class="meldung">Liste wird geladen …</p>
  </section>

  <section id="stellendetail" class="detail">
    <p class="meldung">Wähle links eine Stelle aus.</p>
  </section>
</div>
{% endblock %}
