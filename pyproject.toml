[project]
name = "jobschleuse"
version = "0.1.0"
description = "Stellen finden und Bewerbungsvorlage per LLM füllen"
requires-python = ">=3.13"
dependencies = [
    "httpx",
    "pydantic",
    "openai",
    "pyyaml",
    "python-dotenv",
    "fastapi>=0.141.1",
    "uvicorn>=0.52.1",
    "playwright>=1.62.0",
    "python-jobspy>=1.1.82",
]

[project.scripts]
jobs = "bewerbungs_pipeline.cli:main"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest",
    "ruff>=0.16.4",
]

[tool.pytest.ini_options]
# "error" macht alle Warnungen zu Fehlern, damit neue Warnungen die Suite
# nicht unbemerkt durchlaufen. Ausnahme: starlette.testclient warnt beim
# Einsatz von httpx (statt des optionalen httpx2-Pakets) - das ist für uns
# kein Fehlverhalten, sondern der von starlette vorgesehene Fallback.
filterwarnings = [
    "error",
    "ignore:Using `httpx` with `starlette.testclient` is deprecated; install `httpx2` instead.:starlette.exceptions.StarletteDeprecationWarning",
]

[tool.ruff]
target-version = "py313"

[tool.ruff.lint]
# BLE001 (blind except): Netzfehler-Handling fängt bewusst breit ab, um die
# Pipeline bei Verbindungsproblemen nicht abzubrechen (siehe Kommentare an
# den jeweiligen Stellen). DTZ011 (date.today ohne tz): reine Anzeige-Daten
# lokal, keine Zeitzonen-relevante Logik.
ignore = ["BLE001", "DTZ011"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI-Dependency-Injection ruft Depends() idiomatisch im Default-Argument auf.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Form"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bewerbungs_pipeline"]
